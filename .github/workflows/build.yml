name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest 自带 Visual Studio，用 vswhere 定位并加载 MSVC 环境
      - name: 配置 MSVC 环境
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found" }
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "MSVC toolset not found" }
          Write-Output "VS: $vs"
          "VCVARS=$vs\VC\Auxiliary\Build\vcvars64.bat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 编译
        shell: cmd
        run: |
          call "%VCVARS%" >nul
          if errorlevel 1 exit /b 1
          if not exist build mkdir build
          rc /nologo /fo build\app.res src\resource.rc
          if errorlevel 1 exit /b 1
          cl /nologo /c /std:c11 /utf-8 /W4 /O2 /MT /GS- /Gy ^
             /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_CRT_SECURE_NO_WARNINGS ^
             /Ithird_party /Fo:build\ ^
             src\*.c third_party\cJSON.c
          if errorlevel 1 exit /b 1
          cl /nologo /c /std:c++17 /utf-8 /W4 /O2 /MT /GS- /Gy ^
             /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /D_CRT_SECURE_NO_WARNINGS ^
             /Ithird_party /Fo:build\ ^
             src\*.cpp
          if errorlevel 1 exit /b 1
          link /nologo /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup ^
               /OPT:REF /OPT:ICF /INCREMENTAL:NO ^
               /OUT:build\screenshot-translator.exe ^
               build\*.obj build\app.res ^
               user32.lib gdi32.lib msimg32.lib gdiplus.lib winhttp.lib ^
               comctl32.lib shell32.lib dwmapi.lib shcore.lib advapi32.lib ole32.lib
          if errorlevel 1 exit /b 1

      - name: 验证只依赖系统 DLL
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:VCVARS}\..\..\..\..\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -like '*Hostx64\x64*' } | Select-Object -First 1
          }
          if (-not $dumpbin) { throw "dumpbin not found" }
          $out = & $dumpbin.FullName /nologo /dependents build\screenshot-translator.exe
          $out | Write-Output
          if ($out -match 'MSVCR') { throw "动态链接了 CRT，应该用 /MT" }

      - name: 记录产物体积
        shell: pwsh
        run: |
          $f = Get-Item build\screenshot-translator.exe
          Write-Output ("size = {0:N0} bytes ({1:N1} KB)" -f $f.Length, ($f.Length/1KB))
          "ARTIFACT_SIZE=$($f.Length)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 准备发布用的文件名
        shell: pwsh
        run: Copy-Item build\screenshot-translator.exe build\ScreenshotTranslator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-translator-windows
          path: build\ScreenshotTranslator.exe
          if-no-files-found: error

      # 抽不到对应版本就跳过，下面会退回 --generate-notes
      - name: 从 CHANGELOG 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -SimpleMatch "## $tag " | Select-Object -First 1).LineNumber
          if (-not $start) { exit 1 }
          $rest = $lines[$start..($lines.Count-1)]
          $next = ($rest[1..($rest.Count-1)] | Select-String -Pattern '^## v' | Select-Object -First 1).LineNumber
          if ($next) { $body = $rest[0..($next)] } else { $body = $rest }
          $body -join "`n" | Out-File release-notes.md -Encoding utf8

      - name: 打了 v 开头的 tag 就自动发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (Test-Path release-notes.md) {
            gh release create $tag build\ScreenshotTranslator.exe --title $tag --notes-file release-notes.md
          } else {
            gh release create $tag build\ScreenshotTranslator.exe --title $tag --generate-notes
          }
          # 幂等：tag 重建过时 Release 已存在，改成覆盖附件
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag build\ScreenshotTranslator.exe --clobber
          }
