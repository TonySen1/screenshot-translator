name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 冒烟测试（所有模块能正常导入）
        run: |
          python -c "import config, icons, winutil, screenshot, translator, overlay, tray, settings_window, main; print('所有模块导入成功')"

      - name: 翻译链路测试（对着本地 mock 服务跑，不联网）
        run: python dev/test_translator.py

      - name: 配置读写测试
        run: |
          python -c "
          import json, os, tempfile
          import config as c
          d = tempfile.mkdtemp()
          p = os.path.join(d, 'config.json')
          cfg = c.load_config(p)
          assert os.path.exists(p), '没有自动生成配置文件'
          cfg.font_size = 21
          cfg.api_key = 'sk-ci-test'
          assert c.save_config(cfg, p), '保存失败'
          back = c.load_config(p)
          assert back.font_size == 21 and back.api_key == 'sk-ci-test', '读回来不一致'
          raw = json.load(open(p, encoding='utf-8'))
          assert '_说明' in raw, '保存时把说明字段弄丢了'
          print('配置读写正常')
          "

      # 这两套都不需要显示器：拿不到时脚本会自己跳过窗口相关的检查
      - name: 仓库图标测试
        run: python dev/test_repo_icon.py

      - name: 模型列表测试
        run: python dev/test_model_list.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 打包
        run: python build.py


      - name: 准备发布用的文件名
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          Copy-Item -LiteralPath $exe.FullName -Destination "dist/ScreenshotTranslator.exe"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-translator-windows
          path: dist/*.exe
          if-no-files-found: error

      # 抽不到对应版本就跳过（continue-on-error），下面会退回 --generate-notes
      - name: 从 CHANGELOG 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: python dev/release_notes.py "${{ github.ref_name }}" release-notes.md

      - name: 打了 v 开头的 tag 就自动发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 说明优先用 CHANGELOG 里那一节：本仓库一直是直接往 main 提交、不走 PR，
          # 而 --generate-notes 是按 PR 标题生成的，只会吐一行 Full Changelog 链接。
          $tag = "${{ github.ref_name }}"
          if (Test-Path release-notes.md) {
            gh release create $tag dist/ScreenshotTranslator.exe --title $tag --notes-file release-notes.md
          } else {
            gh release create $tag dist/ScreenshotTranslator.exe --title $tag --generate-notes
          }
          # 幂等：tag 被重建过（补示例图、补测试脚本这类）时 Release 已经存在，
          # gh release create 会直接报错退出。这时改成覆盖已有 Release 的附件。
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag dist/ScreenshotTranslator.exe --clobber
          }
